# This is a basic workflow to help you get started with Actions

name: Docker Build (default)

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
    push:
        branches: [master]
    pull_request:
        branches: [master, docker-swarm]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    docker-default:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Generate Dockerfile
              run: ./generate-Dockerfile.sh

            - name: Build Image
              run: docker build -t gpu-jupyter .build/ # will take a while
			  
            - name: DockerHub Login
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Tag Docker Image
              run: docker tag gpu-jupyter ${{ secrets.DOCKERHUB_USERNAME }}/gpu-jupyter:latest

            - name: Push Docker Image to DockerHub
              run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gpu-jupyter:latest
